<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verbum Vitae app icon">
  <defs>
    <!-- Dark candlelit background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1A0F" />
      <stop offset="100%" stop-color="#0F0A06" />
    </linearGradient>
    <!-- Warm radial halo behind the cross -->
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFD089" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#7A4A1E" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0F0A06" stop-opacity="0" />
    </radialGradient>
    <!-- Polished bronze for the cross + nib -->
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEFC4" />
      <stop offset="35%" stop-color="#E8C275" />
      <stop offset="80%" stop-color="#A8895A" />
      <stop offset="100%" stop-color="#6B4F32" />
    </linearGradient>
    <!-- Soft drop shadow under the engraving -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="3" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background plate (iOS squircle friendly) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect width="512" height="512" rx="96" fill="url(#glow)" />

  <!-- Subtle inner border evocative of manuscript framing -->
  <rect x="22" y="22" width="468" height="468" rx="78"
        fill="none" stroke="#c5a872" stroke-opacity="0.18" stroke-width="2" />

  <!-- Cross + pen nib composition, centered horizontally -->
  <g transform="translate(256 0)" filter="url(#shadow)">
    <!-- ===== CROSS (upper portion) ===== -->
    <!-- Vertical bar -->
    <rect x="-12" y="80" width="24" height="180" rx="4" fill="url(#bronze)" />
    <!-- Horizontal beam -->
    <rect x="-82" y="146" width="164" height="24" rx="4" fill="url(#bronze)" />

    <!-- ===== PEN NIB (descending from the cross) ===== -->
    <!-- Kite-shaped nib body -->
    <path d="
      M -40 260
      Q -44 282, -38 312
      Q -30 346, -18 378
      Q -8 402, 0 420
      Q 8 402, 18 378
      Q 30 346, 38 312
      Q 44 282, 40 260
      Z
    " fill="url(#bronze)" />

    <!-- Central slit of the nib -->
    <line x1="0" y1="260" x2="0" y2="420" stroke="#1A0F08" stroke-width="5"
          stroke-linecap="round" stroke-opacity="0.72" />

    <!-- Vent hole (the breather hole at the top of the slit) -->
    <circle cx="0" cy="292" r="8" fill="#1A0F08" />

    <!-- Specular highlights -->
    <path d="M -32 276 Q -22 322, -10 380"
          stroke="#FFF6D8" stroke-opacity="0.55" stroke-width="3"
          fill="none" stroke-linecap="round" />
    <line x1="-7" y1="92" x2="-7" y2="250"
          stroke="#FFF6D8" stroke-opacity="0.45" stroke-width="2.5"
          stroke-linecap="round" />
    <line x1="-74" y1="153" x2="74" y2="153"
          stroke="#FFF6D8" stroke-opacity="0.4" stroke-width="2.5"
          stroke-linecap="round" />
  </g>
</svg>
