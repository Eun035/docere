<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Verbum Vitae app icon">
  <defs>
    <!-- Dark candlelit plate background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1A0F" />
      <stop offset="100%" stop-color="#0F0A06" />
    </linearGradient>
    <!-- Warm halo radiating from the flame -->
    <radialGradient id="halo" cx="50%" cy="24%" r="48%">
      <stop offset="0%" stop-color="#FFE4A3" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#E8B560" stop-opacity="0.22" />
      <stop offset="75%" stop-color="#7A4A1E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F0A06" stop-opacity="0" />
    </radialGradient>
    <!-- Flame gradient -->
    <radialGradient id="flame" cx="50%" cy="65%" r="62%">
      <stop offset="0%" stop-color="#FFF6D5" />
      <stop offset="35%" stop-color="#FFD46A" />
      <stop offset="75%" stop-color="#E8843B" />
      <stop offset="100%" stop-color="#8C3A1A" stop-opacity="0.55" />
    </radialGradient>
    <!-- Candle wax (highlight bias toward middle for cylindrical look) -->
    <linearGradient id="wax" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A2E20" />
      <stop offset="30%" stop-color="#EFE0C2" />
      <stop offset="55%" stop-color="#FBF1D9" />
      <stop offset="80%" stop-color="#C9B589" />
      <stop offset="100%" stop-color="#2E2418" />
    </linearGradient>
    <!-- Open book page -->
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF5E4" />
      <stop offset="100%" stop-color="#D9C9A0" />
    </linearGradient>
    <!-- Book cover -->
    <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B4A2B" />
      <stop offset="100%" stop-color="#3A2814" />
    </linearGradient>
  </defs>

  <!-- Rounded background plate (iOS squircle friendly) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect width="512" height="512" rx="96" fill="url(#halo)" />

  <!-- Subtle manuscript-style inner border -->
  <rect x="22" y="22" width="468" height="468" rx="78"
        fill="none" stroke="#c5a872" stroke-opacity="0.18" stroke-width="2" />

  <!-- ===== Composition: book (bottom) → candle (middle) → flame (top) ===== -->
  <g transform="translate(256 0)">

    <!-- ===== Flame (top) ===== -->
    <ellipse cx="0" cy="120" rx="22" ry="42" fill="url(#flame)" />
    <ellipse cx="0" cy="130" rx="8" ry="18" fill="#FFFCEB" opacity="0.95" />

    <!-- ===== Wick ===== -->
    <rect x="-3" y="158" width="6" height="28" fill="#2A1A0A" />

    <!-- ===== Candle body ===== -->
    <rect x="-32" y="185" width="64" height="180" rx="3" fill="url(#wax)" />
    <!-- Candle top rim (3D ellipse) -->
    <ellipse cx="0" cy="185" rx="32" ry="7" fill="#A0875A" />
    <ellipse cx="0" cy="182" rx="32" ry="5" fill="#1A0F08" opacity="0.6" />
    <!-- Wax drips -->
    <path d="M -12 335 Q -8 360, 0 368 Q 4 348, 2 335 Z" fill="#FBF1D9" opacity="0.9" />
    <path d="M 18 320 Q 22 340, 24 348 Q 23 330, 21 320 Z" fill="#EFE0C2" opacity="0.85" />

    <!-- ===== Open Book (bottom — candle stands on top) ===== -->
    <g transform="translate(0 385)">
      <!-- Book shadow -->
      <ellipse cx="0" cy="62" rx="200" ry="13" fill="#000" opacity="0.65" />

      <!-- Book cover (back) -->
      <path d="M -190 42 L -190 20 Q -190 12, -180 10 L 180 10 Q 190 12, 190 20 L 190 42 Z" fill="url(#cover)" />

      <!-- Left page -->
      <path d="M -180 14 L -6 -4 L -6 36 L -180 30 Z" fill="url(#page)" stroke="#A88E5C" stroke-width="0.8" />
      <!-- Right page -->
      <path d="M 180 14 L 6 -4 L 6 36 L 180 30 Z" fill="url(#page)" stroke="#A88E5C" stroke-width="0.8" />

      <!-- Center binding shadow -->
      <path d="M -6 -4 L -6 36 L 6 36 L 6 -4 Z" fill="#3A2814" opacity="0.6" />

      <!-- Latin text lines — left page -->
      <g stroke="#5A4222" stroke-width="1.3" stroke-linecap="round" opacity="0.78">
        <line x1="-165" y1="8" x2="-22" y2="0" />
        <line x1="-165" y1="15" x2="-22" y2="7" />
        <line x1="-165" y1="22" x2="-42" y2="14" />
        <line x1="-165" y1="29" x2="-22" y2="21" />
      </g>
      <!-- Latin text lines — right page -->
      <g stroke="#5A4222" stroke-width="1.3" stroke-linecap="round" opacity="0.78">
        <line x1="22" y1="0" x2="165" y2="8" />
        <line x1="22" y1="7" x2="165" y2="15" />
        <line x1="22" y1="14" x2="146" y2="22" />
        <line x1="22" y1="21" x2="165" y2="29" />
      </g>
    </g>
  </g>
</svg>
